services:
  # =================== MongoDB Replica Set (3 nodes) ===================
  mongo1:
    image: mongo:7.0
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo1-data:/data/db
    networks:
      - crackhash-net
    restart: on-failure

  mongo2:
    image: mongo:7.0
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo2-data:/data/db
    networks:
      - crackhash-net
    restart: on-failure

  mongo3:
    image: mongo:7.0
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo3-data:/data/db
    networks:
      - crackhash-net
    restart: on-failure

  mongo-init:
    image: mongo:7.0
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - crackhash-net
    volumes:
      - ./mongo-init.js:/mongo-init.js:ro
    command: >
      bash -c "
        echo 'Waiting for MongoDB to start...';
        sleep 10;
        mongosh --host mongo1:27017 /mongo-init.js;
        echo 'Replica set initiated.';
      "
    restart: "no"

  #  ============================ RabbitMQ =========================
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - crackhash-net
    ports:
      - "15672:15672"  # для доступа к панели управления
    restart: on-failure

  #  ============================ Gateway =========================
  gateway:
    image: crackhash/gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
      - mongo1
      - mongo2
      - mongo3
    networks:
      - crackhash-net
    restart: on-failure

  #  ============================ Worker =========================
  worker:
    image: crackhash/worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - crackhash-net
    restart: on-failure
    # Для масштабирования используйте: docker compose -f docker-compose.local.yml up --scale worker=3

#  ============================ Networks =========================
networks:
  crackhash-net:
    driver: bridge

#  ============================ Volumes =========================
volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  rabbitmq-data: